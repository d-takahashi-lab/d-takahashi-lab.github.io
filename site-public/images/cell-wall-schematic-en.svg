<title id="title">Cell wall polysaccharides and freezing tolerance</title><desc id="desc">A conceptual wall containing cellulose bundles, hemicelluloses and pectin side chains. Cold-induced galactan accumulation contributes to freezing tolerance. Polymer structure, tissue mechanics and survival are studied together.</desc>
