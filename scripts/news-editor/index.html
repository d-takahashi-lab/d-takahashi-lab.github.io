<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="news-token" content="%%TOKEN%%"><title>News編集 | 生命適応科学研究室</title><style>
:root{font-family:Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#171717;background:#fff;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;border-radius:0}button{cursor:pointer;background:white;color:inherit;border:1px solid #888;padding:10px 16px;min-height:44px}button.primary{background:#171717;color:white;border-color:#171717}button:disabled{opacity:.5;cursor:wait}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #171717;outline-offset:3px}header{padding:24px 5%;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font:400 28px Georgia,'Hiragino Mincho ProN',serif;margin:0}header small{color:#626262}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1500px;margin:auto}aside{border-right:1px solid #ddd;padding:32px 24px;min-height:calc(100vh - 90px)}aside>button{width:100%}.list{display:grid;margin-top:24px}.record{border:0;border-top:1px solid #ddd;text-align:left;padding:16px 0;background:none;line-height:1.7}.record[aria-current=true]{border-left:3px solid #171717;padding-left:12px}.record small{display:block;color:#626262}.workspace{padding:32px 40px 80px;min-width:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:24px}.toolbar h2{font-size:20px;font-weight:400;margin:0 auto 0 0}.hint{color:#626262;font-size:13px;line-height:1.85;margin:12px 0 24px}.status{min-height:26px;line-height:1.8;color:#333;margin:0 0 16px}.status.error{color:#a02618}form{display:grid;gap:24px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}label{display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:0}input,textarea,select{border:1px solid #aaa;background:#fff;color:#171717;padding:12px;width:100%;min-height:44px}textarea{resize:vertical;line-height:1.9}fieldset{border:0;border-top:1px solid #ddd;margin:0;padding:24px 0 0;display:grid;gap:20px;min-width:0}legend{padding:0 16px 0 0;font:400 22px Georgia,'Hiragino Mincho ProN',serif}.body-input{min-height:310px}.english{margin-top:8px}details{border-top:1px solid #ddd;padding-top:20px}summary{cursor:pointer;font-size:18px}details>fieldset{margin-top:20px}#photo-box{display:grid;justify-items:start;gap:12px}#photo-box label{width:100%}.photo-preview{max-width:100%;max-height:240px;object-fit:contain;display:block}figure{margin:0}.preview{border-top:1px solid #ddd;padding-top:32px;margin-top:40px}.preview h2{font:400 30px Georgia,'Hiragino Mincho ProN',serif}.preview time{font-size:13px;color:#626262}.preview p{line-height:2;white-space:pre-line;max-width:780px}.preview img{max-width:100%;max-height:420px;object-fit:contain}.inline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.inline button{font-size:13px}.note{font-size:13px;color:#626262;line-height:1.8}.dirty{font-size:13px;color:#626262}#build-message{white-space:pre-wrap;font-size:13px;line-height:1.7;max-height:180px;overflow:auto}.empty{padding:40px 0;color:#626262}[hidden]{display:none!important}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{min-height:0;border-right:0;border-bottom:1px solid #ddd}.list{max-height:220px;overflow:auto}.workspace{padding:24px 6%}.row{grid-template-columns:1fr}header{align-items:start;flex-direction:column}h1{font-size:24px}}
</style></head><body><header><h1>News 編集</h1><small>生命適応科学研究室 · このMacの編集画面</small></header><div class="shell"><aside><button id="new" type="button">＋ 新しい記事</button><div class="list" id="list" aria-label="記事一覧"></div></aside><main class="workspace"><div class="toolbar"><h2 id="editor-heading">記事を選択</h2><span class="dirty" id="dirty"></span><button type="button" id="preview-button">プレビュー</button><button type="button" id="save">下書き保存</button><button type="button" id="publish" class="primary">掲載する</button></div><p class="hint">新しい記事の日付は今日、種別は「研究室」です。変更する場合は詳細設定を開いてください。</p><p id="status" class="status" role="status" aria-live="polite"></p>
<form id="form">
<label>タイトル<input name="jaTitle" required maxlength="200"></label>
<label>本文<textarea name="jaBody" class="body-input" placeholder="空行で段落を分けられます。"></textarea></label>
<label>写真（任意・8MBまで）<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>
<div id="photo-box" hidden><img id="photo-preview" class="photo-preview" alt="選択した記事写真"><button type="button" id="remove-photo">写真を外す</button></div>
<details class="english"><summary>英語版を追加・編集</summary><fieldset><label>Title<input name="enTitle" maxlength="200"></label><label>Body<textarea name="enBody" class="body-input"></textarea></label></fieldset></details>
<details><summary>詳細設定（日付・種別・リンクなど）</summary><fieldset>
<div class="row"><label>日付<input type="date" name="date" required></label><label>種別<select name="type"><option value="LAB">研究室</option><option value="EVENT">学術交流</option><option value="PAPER">論文</option><option value="AWARD">受賞</option></select></label></div>
<label>関連リンク<input name="link" placeholder="https://…"></label>
<label>記事ID<input id="article-id" readonly></label>
</fieldset></details></form>
<section class="preview" id="preview" hidden aria-label="記事プレビュー"><div class="inline"><span class="note">保存前プレビュー</span><select id="preview-language" aria-label="プレビューの言語"><option value="ja">日本語</option><option value="en">English</option></select></div><h2 id="preview-title"></h2><time id="preview-date"></time><figure id="preview-figure" hidden><img id="preview-photo" alt=""><figcaption id="preview-caption"></figcaption></figure><div id="preview-body"></div></section>
<section class="preview"><div class="inline"><button id="build" type="button">サイトに反映</button><a href="http://127.0.0.1:4321/news/" target="_blank" rel="noopener">Newsを開く ↗</a></div><p class="note">下書きは公開サイトに含まれません。写真も記事も保存先はこのMacのウェブサイトフォルダです。</p><p id="build-message" role="status" aria-live="polite"></p></section></main></div>
<script>
const $=s=>document.querySelector(s),form=$('#form'),token=$('meta[name=news-token]').content;
const backend=window.NewsBackend||null;
let records=[],version='',current=null,dirty=false,busy=false,building=false;
function message(text,error=false){$('#status').textContent=text;$('#status').classList.toggle('error',error);}
function setDirty(value){dirty=value;$('#dirty').textContent=value?'未保存の変更あり':'';}
async function api(path,data){if(backend)return backend.api(path,data);const response=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-News-Token':token},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error||'処理できませんでした。');return result;}
function list(){const list=$('#list');list.replaceChildren();for(const article of records){const button=document.createElement('button');button.type='button';button.className='record';button.setAttribute('aria-current',String(article.id===current?.id));const title=document.createElement('span');title.textContent=article.ja.title;const meta=document.createElement('small');meta.textContent=article.date+' / '+(article.status==='draft'?'下書き':'掲載');button.append(title,meta);button.onclick=()=>{if(busy||building)return;if(dirty&&!confirm('未保存の変更があります。保存せずに切り替えますか？'))return;open(article);};list.append(button);}}
function open(article){current=structuredClone(article);form.reset();for(const key of ['date','type','link'])form.elements[key].value=current[key]||'';for(const lang of ['ja','en'])for(const key of ['title','body'])form.elements[lang+key[0].toUpperCase()+key.slice(1)].value=current[lang][key];$('#article-id').value=current.id;$('#editor-heading').textContent=current.ja.title||'新しい記事';$('#preview').hidden=true;setDirty(false);photo();list();message('');}
function collect(){const value=structuredClone(current);for(const key of ['date','type','link'])value[key]=form.elements[key].value;for(const lang of ['ja','en'])for(const key of ['title','body'])value[lang][key]=form.elements[lang+key[0].toUpperCase()+key.slice(1)].value;value.imageAlt=value.imageAlt||value.ja.title;value.imageAltEn=value.imageAltEn||value.en.title;return value;}
async function photo(){const src=current?.image;$('#photo-box').hidden=!src;if(src){try{$('#photo-preview').src=backend?await backend.photoURL(src):'/'+src;}catch(e){message(e.message,true);}}else $('#photo-preview').removeAttribute('src');}
async function preview(scroll=true){const a=collect(),lang=$('#preview-language').value,text=a[lang];$('#preview-title').textContent=text.title||'（タイトル未入力）';$('#preview-date').textContent=a.date;$('#preview-body').replaceChildren();for(const text of a[lang].body.split(/\n\s*\n/).filter(Boolean)){const p=document.createElement('p');p.textContent=text;$('#preview-body').append(p);}$('#preview-figure').hidden=!a.image;if(a.image){$('#preview-photo').src=backend?await backend.photoURL(a.image):'/'+a.image;$('#preview-photo').alt=lang==='en'?a.imageAltEn:a.imageAlt;$('#preview-caption').textContent=lang==='en'?a.imageCaptionEn:a.imageCaption;}$('#preview').hidden=false;if(scroll)$('#preview').scrollIntoView({behavior:'smooth',block:'start'});}
$('#new').onclick=()=>{if(busy||building)return;if(dirty&&!confirm('未保存の変更があります。保存せずに新しい記事を作りますか？'))return;const date=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),id=date+'-'+crypto.randomUUID().slice(0,8);open({id,date,status:'draft',type:'LAB',anchor:'news-'+id,link:'',image:'',imageAlt:'',imageAltEn:'',imageCaption:'',imageCaptionEn:'',ja:{title:'',summary:'',body:''},en:{title:'',summary:'',body:''}});setDirty(true);form.elements.jaTitle.focus();};
form.addEventListener('invalid',e=>{const details=e.target.closest('details');if(details)details.open=true;},true);
form.addEventListener('input',()=>setDirty(true));form.addEventListener('submit',e=>e.preventDefault());
function setBusy(value){
 busy=value;form.inert=value;$('#save').disabled=value;$('#publish').disabled=value;
}
async function saveArticle(status){
 if(busy||!current||!form.reportValidity())return;
 setBusy(true);
 try{const result=await api('/api/save',{version,article:{...collect(),status}});records=result.records;version=result.version;open(records.find(n=>n.id===result.id));message(backend?(current.status==='draft'?'このブラウザに下書きを保存しました。':'GitHubへ保存しました。公開処理の完了後にNewsを確認してください。'):'保存しました。'+(current.status==='draft'?'下書きはサイトに掲載されません。':'「サイトに反映」で確認できます。'));}catch(e){message(e.message,true);}finally{setBusy(false);}
}
$('#save').onclick=()=>saveArticle('draft');
$('#publish').onclick=()=>saveArticle('published');
$('#preview-button').onclick=()=>preview();$('#preview-language').onchange=()=>preview(false);
$('#remove-photo').onclick=()=>{current.image='';photo();setDirty(true);};
$('#photo').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>8*1024*1024){message('写真は8MB以下にしてください。',true);e.target.value='';return;}setBusy(true);try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file);});const result=await api('/api/image',{base64:data});current.image=result.path;current.imageAlt='';current.imageAltEn='';current.imageCaption='';current.imageCaptionEn='';photo();setDirty(true);message('写真を追加しました。記事を保存してください。');}catch(e){message(e.message,true);}finally{setBusy(false);e.target.value='';}};
async function poll(){const state=await api('/api/build');$('#build-message').textContent=state.message;building=state.state==='running';$('#build').disabled=building;if(building)setTimeout(()=>poll().catch(e=>{$('#build-message').textContent=e.message;$('#build').disabled=false;}),1000);}
$('#build').onclick=async()=>{if(backend){window.open(backend.actionsURL,'_blank','noopener,noreferrer');return;}if(dirty){message('先に記事を保存してください。',true);return;}if(busy)return;$('#build').disabled=true;try{await api('/api/build',{});await poll();}catch(e){$('#build-message').textContent=e.message;$('#build').disabled=false;}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
async function bootEditor(){try{const result=await api('/api/news');records=result.records;version=result.version;if(records.length)open(records[0]);else $('#new').click();await poll();}catch(e){message(e.message,true);}}
if(backend)backend.onConnect=bootEditor;else bootEditor();
</script></body></html>
